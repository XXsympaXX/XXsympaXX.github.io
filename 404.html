<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07060d">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Página no encontrada · Choque Estelar</title>
<style>
  :root { --mg: #ff2fb3; --vi: #7a1aff; --cy: #28e7ff; --yl: #ffd84a; --disp: 'Bungee', 'Arial Black', Impact, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #07060d; color: #fff; font: 500 17px/1.5 'Chakra Petch', 'Segoe UI', system-ui, sans-serif; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center;
    background: radial-gradient(60% 50% at 70% 20%, rgba(255,47,179,.35), transparent 70%), radial-gradient(50% 50% at 20% 90%, rgba(40,231,255,.18), transparent 70%), linear-gradient(180deg, #1b0840, #07060d); }
  h1, a { font-synthesis: none; }
  h1 { margin: 0; font: 800 clamp(80px, 22vw, 160px)/1 var(--disp); background: linear-gradient(180deg, #fff 30%, #ff9ad9 60%, var(--vi)); -webkit-background-clip: text; background-clip: text; color: transparent; transform: skewX(-8deg); }
  .k { display: inline-block; padding: 6px 14px; background: var(--yl); color: #12052e; font-weight: 700; letter-spacing: .14em; font-size: 13px; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
  p { color: #c3b9ec; margin: 14px auto 26px; max-width: 30em; }
  .b { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  a { display: inline-flex; align-items: center; min-height: 54px; padding: 0 28px; color: #fff; text-decoration: none; font: 800 17px/1 var(--disp);
      background: linear-gradient(100deg, var(--mg), var(--vi)); clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
  a.alt { background: linear-gradient(100deg, rgba(40,231,255,.25), rgba(122,26,255,.3)); }
  a:focus-visible { outline: none; background: var(--yl); color: #12052e; }
</style>
</head>
<body>
<main>
  <span class="k">¡FUERA DEL ESCENARIO!</span>
  <h1>404</h1>
  <p>Esta página no existe o ha cambiado de sitio.<br><span lang="en">This page does not exist.</span></p>
  <div class="b">
    <a id="play" href="/jugar/">JUGAR</a>
    <a id="home" class="alt" href="/">INICIO</a>
  </div>
</main>
<script>
  // Busca la raíz del sitio subiendo por la ruta (sirve en usuario.github.io/ y en usuario.github.io/repo/).
  (function () {
    try {
      var seg = location.pathname.split('/').filter(Boolean), cands = [];
      for (var i = seg.length - 1; i >= 0; i--) cands.push('/' + seg.slice(0, i).join('/') + (i ? '/' : ''));
      var home = document.getElementById('home'), play = document.getElementById('play');
      (function next(k) {
        if (k >= cands.length) return;
        fetch(cands[k] + 'manifest.webmanifest', { method: 'HEAD' }).then(function (r) {
          if (r.ok) { home.href = cands[k]; play.href = cands[k] + 'jugar/'; } else next(k + 1);
        }, function () { next(k + 1); });
      })(0);
    } catch (e) {}
  })();
</script>
</body>
</html>
